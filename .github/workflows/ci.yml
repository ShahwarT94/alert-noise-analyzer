name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      # Each check runs even if an earlier one failed, so a single CI run
      # reports every problem at once. Any non-zero step still fails the job.
      - name: ruff (lint)
        if: ${{ !cancelled() }}
        run: ruff check .

      - name: black (format check)
        if: ${{ !cancelled() }}
        run: black --check .

      - name: mypy (type check)
        if: ${{ !cancelled() }}
        run: mypy

      - name: pytest (with coverage)
        if: ${{ !cancelled() }}
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
